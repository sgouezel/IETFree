name = "IETFree"
defaultTargets = ["IETFree", "Challenge"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false # no "assume a typo is a new variable"
relaxedAutoImplicit = false # no "assume a typo is a new variable"
maxSynthPendingDepth = 3 # same as mathlib, changes behaviour of typeclass inference
weak.linter.flexible = true # no rigid tactic (e.g. `exact`) after a flexible tactic (e.g. `simp`)
# Enable all mathlib linters: automatically matches what mathlib uses.
weak.linter.mathlibStandardSet = true
# Every warning is an error: every module of the library elaborates clean, so a new warning fails the build
# instead of scrolling past.
warningAsError = true
# Switch off warnings generated by `sorry`: the four `sorryAx` of `Challenge.lean` are deliberate
# (the definition hole `mkIETEquiv` and the statements `coe_mkIETEquiv`, `main` and the remark's
# conclusion), and `#print axioms main` is their guard.
warn.sorry = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "IETFree"

# the statement file lives at the root, outside `IETFree/`
[[lean_lib]]
name = "Challenge"
