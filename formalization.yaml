    - source: "Lemma 3.1 (the length map of gf is an invertible affine map), the parts used: injectivity and the absolute continuity of the pushforward"
      lean: "Pair.compLen_injective, Pair.compLen_absolutelyContinuousAt, Pair.absolutelyContinuous_map_blockFree"
      module: "IETFree/Pair/LengthMap.lean, IETFree/Pair/Block/AeBlockGood.lean, IETFree/Pair/Block/AETransfer.lean"
      status: "proved"
