# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4) for the IETFree development.
# Standard: https://github.com/mathlib-initiative/formalization.yaml
#
# Everything below describes the tree this file sits in: the Lean sources are in IETFree/, the
# current notes are NOTES.md and the full ledger is HISTORY.md; `lake build` builds the tree
# (incrementally, in parallel);
# ./SlowBuild.sh is the slow thorough check: the same modules with plain `lean`, in dependency order,
# plus the axiom report, the sorry count and the comparator gate.  Counts and line references were
# checked against the tree at the time of writing.

version: "v0.4"

project:
  name: "IETFree — almost every pair of interval exchange transformations does not generate a free group"
  description: >-
    A Lean 4 formalization of the paper's main theorem: for any permutations π and σ of the d and e
    intervals, the set of pairs of length vectors (λ, μ) for which the two interval exchange
    transformations f_{π,λ} and f_{σ,μ} generate a free group of rank 2 has measure zero. The
    development contains the irreducible case (Theorem 2.6, from unique ergodicity, rigidity by
    translations and the Diophantine condition), the almost-everywhere Diophantine property
    (Proposition 2.5, from the easy direction of Khintchine–Groshev), Lemma 3.1 (the length map of the
    composition is injective and absolutely continuous), the reduction of the general case to the
    blocks between consecutive pair-splitting singularities (Lemmas 3.2 and 3.3), Lemma 3.4 (a word
    trivial on a block, obtained by rescaling the block and applying Theorem 2.6 to it), and the
    assembly of the per-block words into a single nontrivial word. Masur–Veech unique ergodicity and
    Veech's rigidity are proved as well, by the Rauzy–Veech induction (`IETFree/RauzyVeech/`,
    `IETFree/Rigidity/`, `IETFree/UniqueErgodicity/`), so the main theorem is unconditional. The
    remark that follows the main theorem — the relation of a trivial word is robust, so the pairs
    that do not generate a free group contain an open set of full measure — is proved in
    `IETFree/Pair/RobustRelation/`: the symbolic data of an arbitrary word and the robustness at a
    point of the conull set `Ω'` (`evalWord_eventually_eq_one`), and the assembly of the open conull
    set (`exists_isOpen_subset_hasRelation_of_ae`), which `ChallengeSolved.lean` feeds with the a.e.
    relation it proves from `main` — the conclusion on `Δ_π × Δ_σ` is
    `exists_isOpen_ae_exists_nontrivial_evalWordEquiv_eq_one`.
  authors:
    - "Sébastien Gouëzel"
  authors_note: >-
    `authors` lists the human author of the project: the paper, the mathematical statements and the
    design of the library are theirs. The proof scripts themselves were written by AI agents
    inside SAIR Open Math OS; that is what the `automation` block records. 
  responsible_maintainers:
    - "Sébastien Gouëzel"
  license: "Apache-2.0"

sources:
  - title: "Almost every pair of interval exchange transformations does not generate a free group"
    authors:
      - "Sébastien Gouëzel"
    id: "https://arxiv.org/abs/2610.29993"
    type: "article"
    location: "Theorem 1.1 (main theorem); Sections 2 and 3 for the intermediate results"
    relationship: "formalizes"
    note: >-
      Theorem 1.1 is formalized unconditionally: the two results it quotes from the literature
      (a.e. unique ergodicity and a.e. rigidity by translations of an irreducible exchange) are
      proved in the library, by the Rauzy–Veech induction rather than by the arguments of their
      original papers — see the Masur and Veech entries below and `status.main_results`. Lemma 1.3
      (an irrational rotation and an interval exchange do not generate a free group) is an
      illustration in the introduction and is not formalized; the remark after Theorem 1.1 (that
      the set of good pairs is open and of full measure) *is* formalized, in
      `IETFree/Pair/RobustRelation/` with its two conclusions in `IETFree/ChallengeSolved.lean`.
      See `fidelity.divergences` for the departures in form.

  # The results the paper quotes from the literature: their statements are proved here, by the
  # Rauzy–Veech induction (not by these papers' arguments), so `relationship: formalizes` records the
  # statement, not the proof.
  - title: "Interval exchange transformations and measured foliations"
    authors:
      - "Howard Masur"
    id: "Ann. of Math. (2) 115 (1982), 169–200"
    type: "article"
    relationship: "formalizes"
    location: "unique ergodicity of almost every interval exchange with an irreducible permutation"
    note: >-
      One of the two original sources of `masurVeech`; its statement is `masurVeech_ae_unique_invariant`
      (`IETFree/UniqueErgodicity/MainTheorem.lean`), proved by the Rauzy–Veech induction, and
      `masurVeech` (`IETFree/Pair/Irreducible.lean`) states it for the exchange `mkIET1 lam π`.

  - title: "Gauss measures for transformations on the space of interval exchange maps"
    authors:
      - "William A. Veech"
    id: "Ann. of Math. (2) 115 (1982), 201–242"
    type: "article"
    relationship: "formalizes"
    location: "unique ergodicity of almost every interval exchange with an irreducible permutation"
    note: "The other original source of `masurVeech`; its statement is `masurVeech_ae_unique_invariant`."

  - title: "The metric theory of interval exchange transformations. I. Generic spectral properties"
    authors:
      - "William A. Veech"
    id: "Amer. J. Math. 106 (1984), 1331–1359"
    type: "article"
    relationship: "formalizes"
    location: "Theorem 1.2 (a.e. unique ergodicity) and Theorem 1.4 (a.e. rigidity by translations)"
    note: >-
      The two theorems the paper cites, in the paragraph after Definition 2.1 and in the proof of
      Proposition 2.4. Their statements are proved here: `masurVeech`
      (`IETFree/Pair/Irreducible.lean`) and `veechRigidity` (same file).  The rigidity half is not
      only the statement: `IETFree/Rigidity/` follows this paper's own argument — its (3.1)–(3.2)
      in `Rigidity/Matrix.lean` and its (3.3)–(3.8) in `Rigidity/RigidSet.lean` — so the comment
      above, that the statements are proved by other arguments than their papers', holds for the
      unique-ergodicity half only.

  # The documents the Rauzy–Veech development *follows*: it is their arguments, in this library's
  # language, rather than statements of theirs that the tree formalises.  `location:` says which
  # directories use them, and the note fixes the short form the Lean docstrings use, so that a
  # pointer in the code names its document.
  - title: "Continued fraction algorithms for interval exchange maps: an introduction"
    authors:
      - "Jean-Christophe Yoccoz"
    id: "doi:10.1007/3-540-31347-8_12 (Frontiers in Number Theory, Physics, and Geometry I, Springer, 2006, 401–435)"
    type: "article"
    relationship: "adapts"
    location: "§2–§4.4 (pp. 3–20): the Rauzy–Veech induction, the towers and the ray criterion; used by `IETFree/RauzyVeech/`"
    note: >-
      The source of the induction the whole of `IETFree/RauzyVeech/` follows, and of the Masur–Veech
      proof the library gives (`masurVeech_ae_unique_invariant`).  §5–§6 of the survey
      (suspensions, the Teichmüller flow, Zorich acceleration) are not used, nor is §3.4 (the Denjoy
      model).  In the Lean
      docstrings this document is called **"Yoccoz"**, and its page numbers (p. 13, p. 16, …) are the
      survey's own.

  - title: "Exponential mixing for the Teichmüller flow"
    authors:
      - "Artur Avila"
      - "Sébastien Gouëzel"
      - "Jean-Christophe Yoccoz"
    id: "doi:10.1007/s10240-006-0001-5 (Publ. Math. Inst. Hautes Études Sci. 104 (2006), 143–211)"
    type: "article"
    relationship: "adapts"
    location: "Appendix A (the graded induction: the distortion estimate behind the rich path); used by `IETFree/RauzyVeech/RichPath/`"
    note: >-
      The graded induction of the appendix is what makes the greedy Rauzy–Veech path *rich*, which
      is the input the ray criterion needs.  In the Lean docstrings this document is called
      **"AGY"**; its level statements `Γ₁`, `Γ₂`–`Γ₄` are the appendix's.

  - title: "Simplicial systems for interval exchange maps and measured foliations"
    authors:
      - "Steven P. Kerckhoff"
    id: "Ergodic Theory Dynam. Systems 5 (1985), no. 2, 257–271"
    type: "article"
    relationship: "adapts"
    location: "the criterion behind `RayCondition` (`IETFree/RauzyVeech/`): positive blocks on a nested sequence of simplices imply unique ergodicity"
    note: >-
      The ray criterion the library uses is Kerckhoff's, in the form the two documents above state
      it.  The docstrings name it "Kerckhoff's criterion" where it is used.

  - title: "The cohomological equation for Roth type interval exchange maps"
    authors:
      - "Stefano Marmi"
      - "Pierre Moussa"
      - "Jean-Christophe Yoccoz"
    id: "J. Amer. Math. Soc. 18 (2005), 823–872"
    type: "article"
    relationship: "background"
    location: "the top/bottom permutation formalism of `IETDatum₂` (`piBottom = π₀`, `piTop = π₁`)"
    note: >-
      The two-permutation presentation the library is built on (`IETFree/TopBotFormalism.lean`) is
      this paper's (and Yoccoz's, §2); it is cited in the docstrings as the "Marmi–Moussa–Yoccoz
      formalism".

classification:
  arxiv:
    - "math.DS"
  msc2020:
    - "37E05"   # dynamical systems involving maps of the interval
    - "37A15"   # general groups of measure-preserving transformations
    - "37C85"   # dynamics of group actions other than Z and R
    - "37A25"   # ergodicity, mixing
    - "20E05"   # free nonabelian groups
    - "11J83"   # metric theory of Diophantine approximation

status:
  scope: >-
    The whole of the paper, unconditionally, Lemma 1.3 excepted.  All 120 modules of `IETFree/` are
    sorry-free; every one of them is used in the proof of `main` or, for the remark's own modules,
    proved from it (`ChallengeSolved` imports them and feeds `main` into their assembly), the library
    having been pruned along the declaration dependency graph.  The only four sorries in the tree are
    the deliberate statements of the comparator challenge `Challenge.lean` (the definition hole
    `mkIETEquiv`, and the statements `coe_mkIETEquiv`, `main` and the remark's conclusion
    `exists_isOpen_ae_exists_nontrivial_evalWordEquiv_eq_one`).  The challenge is one
    self-contained file (`import Mathlib` only) which declares, verbatim, the library declarations its
    statement uses.  `IETFree/ChallengeSolved.lean` is the solution: it fills the hole with the
    library's `mkIETEquiv`, and proves `main` — Theorem 1.1 in the challenge's words — from the
    library, with no hypothesis left.  The two results the paper quotes from the literature are
    proved, by the Rauzy–Veech induction: unique ergodicity in `IETFree/RauzyVeech/` and
    `IETFree/UniqueErgodicity/MainTheorem.lean` (`masurVeech_ae_unique_invariant`), with its strong
    form (uniform Birkhoff convergence, `uniformBirkhoff_of_uniqueErgodic`) and Lemma 2.9 in
    `IETFree/UniqueErgodicity/`; rigidity by translations in `IETFree/Rigidity/`, with
    `veechRigidity` itself in `IETFree/Pair/Irreducible.lean`.  `lake comparator` is the gate: it
    checks the challenge against the solution declaration by declaration — it has been run on this
    tree, with the three targets of `comparator.json`, and passes — and `SlowBuild.sh` fails if it
    does not pass.
  # The four `sorryAx` of the tree are deliberate and all in `Challenge.lean`: the definition hole
  # `mkIETEquiv`, and the statements `coe_mkIETEquiv`, `main` and the remark's conclusion
  # `exists_isOpen_ae_exists_nontrivial_evalWordEquiv_eq_one`.  No other module has one.
  sorry_count: 4
  sorry_in_definitions: 1
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "main"
      file: "IETFree/ChallengeSolved.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      note: >-
        Theorem 1.1, unconditional.  No literature dependency: the two results the paper quotes are
        marshalled by `masurVeech` and `veechRigidity` in the same file, from the two campaigns below.
    - declaration: "masurVeech_ae_unique_invariant"
      file: "IETFree/UniqueErgodicity/MainTheorem.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      note: >-
        The literature's a.e. unique ergodicity of an irreducible exchange, proved by the
        Rauzy–Veech induction (richness of the greedy path, the uniform bound on the entries of a
        positive Rauzy matrix, unique ergodicity from positive blocks).
    - declaration: "masurVeech"
      file: "IETFree/Pair/Irreducible.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      note: >-
        The same statement in the library's vocabulary, for the exchange `mkIET1 lam π`: almost every
        length vector gives a uniquely ergodic exchange, in the sense of Definition 2.1 (a unique
        invariant probability measure carried by `[0, 1)`).  The uniform Birkhoff-average form is a
        separate predicate, `UniformBirkhoff`, *proved* from this one
        (`uniformBirkhoff_of_uniqueErgodic`) and assumed nowhere.
    - declaration: "veechRigidity"
      file: "IETFree/Pair/Irreducible.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      note: >-
        The literature's a.e. rigidity by translations, proved by the Rauzy–Veech induction (the
        rigid step and the hitting lemma).
    - declaration: "main_theorem_of_blocks"
      file: "IETFree/Pair/Block/Lemma.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      note: >-
        Theorem 1.1 in the library's block form; it applies `masurVeech` and `veechRigidity`, which
        is where the paper's Section 2–3 argument uses them.
    - declaration: "irreducible_case"
      file: "IETFree/Pair/Irreducible.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      note: >-
        Theorem 2.6: no literature dependency of its own, unique ergodicity and rigidity are its
        hypotheses.
    - declaration: "ae_diophantine"
      file: "IETFree/Pair/Diophantine.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      note: >-
        Proposition 2.5. Its proof is an elementary Borel–Cantelli argument; no external theorem
        is assumed.
    - declaration: "Pair.exists_isOpen_ae_exists_nontrivial_evalWordEquiv_eq_one"
      file: "IETFree/ChallengeSolved.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      note: >-
        The remark after Theorem 1.1, on the paper's `Δ_π × Δ_σ`, with the two normalisations as
        hypotheses: this is the challenge's third target, and it reaches no declaration the
        challenge does not already carry.  The a.e. relation it needs is proved from `main` in the
        same file, and the free-coordinate form is not a statement of its own: it is
        `Pair.RobustRelation.exists_isOpen_subset_hasRelation_of_ae` applied to that relation.

automation:
  methods:
    - method: "agent"
      framework: "SAIR Open Math OS"
      tool_setup: >-
        An AI agent working in a Linux VM under Open Math OS, writing Lean 4.35.0 against Mathlib
        pinned at the `v4.35.0` tag. The repository is a genuine Lake project — `lakefile.toml`,
        `lake-manifest.json`, `lean-toolchain` — with one Lean library for `IETFree/` and one for each
        of the two statement files, so `lake build` (after `lake exe cache get`) builds all 122
        modules.
        That build enables the Mathlib linter set and is warning-free: a clean `lake build` reports no
        linter warning at all, and neither does `SlowBuild.sh`; `warningAsError` is set, so a warning
        introduced later fails the build.  The declaration linters, which
        `lake build` does not run, are clean as well: Mathlib's lint driver (`runLinter`) reports
        0 findings on every declaration of the library.
        In the development VM Mathlib is a root-owned, read-only, prebuilt tree, which Lake cannot use
        as a package, so `SlowBuild.sh` reproduces the same compilation with plain `lean`, in the same
        order and with the same options, and additionally prints the axiom report and the sorry count.
        While a file was being worked on, one module was compiled at a time with a small helper script,
        and the full build was run at the end. The import list of the umbrella `IETFree.lean` is
        generated, by `lake exe mk_all --lib IETFree`, and sorted by module name. The library carries
        a single axiom check, `#print axioms main`, registered directly below `main` in
        `IETFree/ChallengeSolved.lean`, and `SlowBuild.sh` fails with `--strict` if `sorryAx` is
        reachable from it. The comparator pair is checked by the compiler's own tool, `lake comparator`,
        which reads the root `comparator.json`; it is a separate command, not part of `lake build`.
        The agent kept the ledger (now `HISTORY.md`, formerly `NOTES.md`), which
        records every statement that had to be restated and why.
      prompting_notes: >-
        Work proceeded one declaration at a time from the earliest module in the build order, with a
        single-module compile after every edit. Two of the paper's statements were mis-formalized on
        the first reading and were caught by explicitly searching for counterexamples (a machine-
        checked counterexample to the first form of Lemma 3.2, and one to the first form of the
        `cell` field of `IsCompPresentation`); after that, "state it, try to refute it, then prove it"
        was the standing instruction for every new statement. Each theorem's assumptions were also
        audited afterwards for hypotheses that are derivable from the others.
    - method: "autonomous"
      framework: "Ultramath (parallel proof swarms) and Dream-RSI (discovery runs)"
      tool_setup: >-
        For hard isolated lemmas, several identical agents were started at once on different
        directions and their submissions were checked by compilation before being landed; the
        statements themselves were frozen as self-contained files and given to a proof-search
        harness. Landed this way: `IsCutSet.transl_of_locally`, `IsCutSet.comp`,
        `isIET_mkIETFun`, `exists_mkIETEquiv_eq`, `ae_diophantine`, `exists_lattice_cuts`,
        `exists_lattice_displacement`, `commute_of_zpow_eq`, `rotate_cyclically_reduced`, and the
        image side of the block presentation.
      prompting_notes: >-
        Each run was given one self-contained statement (importing only Mathlib, ending in
        `:= by sorry`) plus the route in the docstring; the outcomes are recorded in the development
        ledger (`HISTORY.md`), including the run stopped unsolved (`nontrivial-commutator`) and the one
        whose statement is not in the library (`continuous-domination`).
  notes: >-
    The human author set the task, the paper's statements, the design of the library and the build,
    and reviewed the outcome; the proof scripts were produced by the agents above. Spend is not recorded
    by the harness, so `spend_usd` is omitted rather than guessed. The development ledger
    (`HISTORY.md`, formerly `NOTES.md`, an append-only log) is the primary record of the process; the
    trimmed current notes are `NOTES.md`.

fidelity:
  divergences: >-
    Thirteen departures in form, none of which changes a statement of the paper. (1) The paper works
    in a
    connected component of the complement of finitely many hyperplanes; the formalization uses an open
    ball on which one fixed list, one fixed permutation and one fixed combinatorial type present the
    composition, and covers the almost-everywhere statement by a countable family of such balls. As a
    consequence no connectedness, preconnectedness or convexity hypothesis appears anywhere, and the
    monotonicity of the singularity list is carried pointwise (`compLenVec G.s q (monoAt G hq)`)
    instead of globally. (2) "Except on finitely many hyperplanes" is replaced by the Diophantine
    condition `¬ IsBadParam`, whose null set is proved with the same Khintchine–Groshev argument as
    Proposition 2.5. (3) The combinatorial type of the composition is carried as explicit data
    (`IsCompType` with a cut map `a : Fin (d+1) → Fin (n+1)` and a cell map `B : Fin n → Fin e`,
    `SingularityShape`, and the block permutation as an explicit `Equiv.Perm (Fin (l - k))`), so the
    two literature inputs, which quantify over permutations, apply to a block directly. (4) Lemma 3.2
    is stated intrinsically on the two data (`IsCompIrreducibleOn`: no invariant initial sub-block),
    rather than through the restriction of `ρ`. (5) `UniqueErgodic` is Definition 2.1 verbatim (a
    unique invariant probability measure carried by `[0, 1)`); the uniform Birkhoff-average form that
    Lemmas 2.9 and 2.10 use is a *separate* predicate, `UniformBirkhoff`, proved from it
    (`uniformBirkhoff_of_uniqueErgodic`) and assumed nowhere. (6) Where an almost-everywhere
    statement needs the simplex membership, it is carried as a binder
    (`∀ᵐ λ ∂(simplexVolume d), ∀ (h : λ ∈ simplex d), …`) rather than by restricting the measure to a
    full-measure subset — the shape of `ae_diophantine_of_mem` and
    `ae_isRigidByTranslations_mkIET1`; the headline statements (`main`, `ae_diophantine`,
    `masurVeech`) need no such binder. (7) `simplexVolume d` is the pushforward of
    Lebesgue measure on the free coordinates rather than Lebesgue measure on the simplex, so
    "maximal rank" appears as an absolute-continuity statement and no Jacobian is computed. (8) Lemma
    3.1's "invertible affine map" is split into injectivity (`compLen_injective`) and absolute
    continuity of the pushforward (`compLen_absolutelyContinuousAt`) rather than an explicit inverse.
    (9) The degenerate block of Lemma 3.4 is split off explicitly, the hypothesis `2 ≤ l - k` being
    what makes the rescaled exchange non-trivial; at `l - k = 1` the rescaled lengths are all `1` and
    the exchange is the identity, which is not uniquely ergodic. (10) Commutators are Mathlib's
    `⁅a, b⁆ = a * b * a⁻¹ * b⁻¹` rather than the paper's `[a, b] = a⁻¹b⁻¹ab = ⁅a⁻¹, b⁻¹⁆`. Lemmas
    that hold in either convention are stated with `⁅·,·⁆` (Lemma 2.7, the word-length bound, the
    evaluation of a commutator, the assembly); the support estimate of Lemmas 2.8–2.10, where the
    `ψ⁻¹` term is measured by the unique ergodicity of `f`, is stated for `⁅φ⁻¹, ψ⁻¹⁆`, which is the
    paper's commutator, so its proof is unchanged. The two conventions vanish together
    (`commutatorElement_inv_inv_eq_one_iff`). (11) `IsRigidByTranslations` asks in addition that the
    sets `B n` lie in `[0, 1)`, which Definition 2.2 does not require: the formal predicate is
    therefore strictly stronger, and the conjunct is what `exists_word_small_support` uses to place a
    point in `[0, 1)`. (12) `simplex α` is `{∑ lam = 1}` without the positivity of the coordinates, so
    the statements on it (`masurVeech`, `irreducible_case`) cover degenerate length vectors as well as
    the paper's open simplex; nothing is assumed about them. (13) `IsDiophantine` is total on
    `(Fin d → ℝ≥0) × (Fin e → ℝ≥0)` and holds vacuously at `lam = mu = 0`, whereas Definition 2.3 is
    stated on `Δ_π × Δ_σ`; every consumer is at a simplex point.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    No human referee and no independent human reviewer has checked this development against the
    paper; the author of the paper reviewed that the state of the library is acceptable, but did not
    verify it line by line. The challenge file has been crafted by the human author, to make sure that
    the theorem it claims corresponds to the main theorem of the paper.
    What has been done: every module is compiled and the axioms of the main
    theorem printed (`#print axioms main`, `[propext, Classical.choice, Quot.sound]`); and the
    development went through the audits recorded in the ledger (`HISTORY.md`) — two refutations of
    mis-formalized statements, an audit of the hypotheses of every declaration (the derivable ones
    removed), a dead-code scan of the whole library, a docstring pass, and an
    elaboration-performance pass. The comparator pair is checked by the compiler's own tool,
    `lake comparator`, which reads the root `comparator.json`, builds and exports both modules inside
    its `bwrap` sandbox, compares them declaration by declaration and replays the solution into Lean's
    kernel.  On the final tree it prints `Lean default kernel accepts the solution` and
    `Your solution is okay!` and exits 0; `enable_nanoda` is off because the sandbox cannot bind
    `/opt/lean/bin/nanoda_bin` through this VM's `/opt/lean` symlink.  The gate is a separate command,
    not part of `lake build`; `SlowBuild.sh` runs it at the end.  The root module's import list is
    regenerated by `lake exe mk_all --lib IETFree`. Review by a mathematician other than the author
    would be the natural next step.

alignment:
  # every library declaration is in `IntervalExchange` or one of its subjects (`Pair`,
  # `RauzyVeech`, `RauzyVeech.RichPath`, `Rigidity`, `UniqueErgodicity`), and the challenge file
  # states Theorem 1.1 in the same namespace; the `lean:` names below are relative to this one
  namespace: "IntervalExchange"
  # status: "proved" for a theorem or lemma, "implemented" for a definition, "not-formalized" for an
  # item of the paper that is not in the tree.
  statements:
    - source: "Theorem 1.1 (main theorem)"
      lean: "main"
      module: "IETFree/ChallengeSolved.lean"
      status: "proved"
      note: >-
        Unconditional: no hypothesis on `d`, `e`, `π` or `σ`.  This is `Challenge.main` in its words,
        and `#print axioms main` reports `[propext, Classical.choice, Quot.sound]`.  The proof
        applies `masurVeech` and `veechRigidity` (the two inputs below) to discharge every
        hypothesis, and derives the statement from the a.e. block data.
    - source: "Remark after Theorem 1.1 (robustness of the relation)"
      lean: "Pair.evalWord_eventually_eq_one"
      module: "IETFree/Pair/RobustRelation/Robustness.lean"
      status: "proved"
      note: >-
        A word which is trivial at a parameter pair on which no nontrivial integer relation between
        the free lengths vanishes (`∀ N, q₀ ∈ Pair.goodParamsAt N d e`, which
        `Pair.forall_goodParams_iff` identifies with the paper's set `Ω'`) stays trivial on a
        neighbourhood of that pair.  The threshold form with `4 * |w| + 4` in place of `Ω'` is
        `Pair.evalWord_eventually_eq_one_of_goodParams`.  The candidate cuts of the word and its displacements
        on the resulting pieces are affine functions of the parameter (`Pair.WordData`), built letter
        by letter (`Pair.exists_wordData_singleton`, `Pair.wordData_append_singleton`); at a point of
        `Ω'` two distinct candidates never coincide, so the pieces are the genuine ones.
    - source: "Remark after Theorem 1.1 (a full measure open set of pairs not generating a free group), the paper's coordinates"
      lean: "Pair.exists_isOpen_ae_exists_nontrivial_evalWordEquiv_eq_one"
      module: "IETFree/ChallengeSolved.lean"
      status: "proved"
      note: >-
        The same statement on the paper's `Δ_π × Δ_σ`: an open set `O` of the ambient space
        `(Fin d → ℝ≥0) × (Fin e → ℝ≥0)`, of null complement for `simplexVolume d × simplexVolume e`,
        such that every `p ∈ O` whose two vectors have total mass `1` carries a nontrivial word
        trivial for `mkIETEquiv p.1 π 0` and `mkIETEquiv p.2 σ 0`.  The two normalisation
        conditions are hypotheses rather than an intersection with `simplex (Fin d) ×ˢ simplex
        (Fin e)`, because the product of the simplices has empty interior in the ambient space, so
        the open set can only be an open set of the ambient space; writing them as hypotheses keeps
        the statement free of any project definition.  The free-coordinate form of the remark — an
        open set of full measure for the product of the two restricted Lebesgue measures on the
        regions, every point of which carries a nontrivial trivial word (`Pair.HasRelation`) — is not
        a statement of its own: it is `Pair.RobustRelation.exists_isOpen_subset_hasRelation_of_ae`
        applied to the a.e. relation, which is proved from `main` in `ChallengeSolved.lean`.
    - source: "Lemma 1.3 (an irrational rotation and an interval exchange do not generate a free group)"
      lean: "—"
      module: "—"
      status: "not-formalized"
      note: >-
        An illustration in the introduction; not part of this development.
    - source: "Definition 2.1 (uniquely ergodic)"
      lean: "UniqueErgodic"
      module: "IETFree/IET.lean"
      status: "implemented"
      note: >-
        The weak form: a unique invariant probability measure carried by `[0, 1)`.  The strong form,
        uniform convergence of the Birkhoff averages of every continuous test function, is the
        predicate `UniformBirkhoff` (`IETFree/UniqueErgodicity/Basic.lean`), proved from this one by
        `uniformBirkhoff_of_uniqueErgodic` (`IETFree/UniqueErgodicity/Theorem2.lean`).
    - source: "a.e. interval exchange is uniquely ergodic (Masur; Veech)"
      lean: "Pair.masurVeech"
      module: "IETFree/Pair/Irreducible.lean"
      status: "proved"
      note: >-
        From `masurVeech_ae_unique_invariant` (`IETFree/UniqueErgodicity/MainTheorem.lean`), by the Rauzy–Veech
        induction, through Theorem 2 (`IETFree/UniqueErgodicity/`).  It carries `2 ≤ d`, which is
        necessary on a single cell.
    - source: "Definition 2.2 (rigid by translations)"
      lean: "IsRigidByTranslations"
